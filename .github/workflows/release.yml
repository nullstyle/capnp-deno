name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The local workflow and every checkout resolve to this tag's exact commit.
  validate:
    uses: ./.github/workflows/validation.yml

  github-release:
    name: Publish tested native binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: validate
    permissions:
      contents: write
    steps:
      - name: Download only the native artifacts from this validation run
        uses: actions/download-artifact@v4
        with:
          pattern: capnpc-deno-*
          path: dist
          merge-multiple: true
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
